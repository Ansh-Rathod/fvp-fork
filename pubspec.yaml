name: fvp
description: video_player plugin and backend APIs. Support all desktop/mobile platforms with hardware decoders, optimal renders. Supports most formats via FFmpeg
version: 0.39.0
homepage: https://github.com/wang-bin/fvp
topics:
  - video
  - player
  - video-player
  - ohos
  - elinux

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  ffi: any
  flutter:
    sdk: flutter
  logging: any
  path: any
  plugin_platform_interface: any
  collection: any
  html: any
  path_provider: any
  http: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  ffigen: '>=9.0.0 <13.0.0'
  lints: any

flutter:
  plugin:
    platforms:
      android:
        package: com.mediadevkit.fvp
        pluginClass: FvpPlugin
      ios:
        pluginClass: FvpPlugin
        sharedDarwinSource: true
      linux:
        dartPluginClass: VideoPlayerRegistrant
        pluginClass: FvpPlugin
      macos:
        pluginClass: FvpPlugin
        sharedDarwinSource: true
      windows:
        dartPluginClass: VideoPlayerRegistrant
        pluginClass: FvpPluginCApi
      elinux:
        dartPluginClass: VideoPlayerRegistrant
        pluginClass: FvpPlugin
      ohos:
        dartPluginClass: VideoPlayerRegistrant
        pluginClass: FvpPlugin
